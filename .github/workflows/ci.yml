name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v3
    - name: Set up Swift
      uses: fwal/setup-swift@v2
      with:
        swift-version: '6.1'
    - name: Build
      run: swift build --configuration release
    - name: Run Tests
      run: swift test --configuration release
